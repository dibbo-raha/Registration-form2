```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-group input,
        .checkbox-group input,
        .skills input {
            width: auto;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skills label {
            font-weight: normal;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .buttons input {
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn {
            background: #007bff;
            color: white;
            border: none;
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        .reset-btn {
            background: #dc3545;
            color: white;
            border: none;
        }

        .reset-btn:hover {
            background: #a71d2a;
        }

        .required {
            color: red;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <p class="subtitle">
            Create your account by filling out the information below.
        </p>

        <form action="#" method="post" enctype="multipart/form-data">

            <!-- Name -->

            <div class="form-row">

                <div class="form-group">

                    <label for="firstname">
                        First Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstname"
                        name="firstname"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastname">
                        Last Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        placeholder="Enter last name"
                        required
                    >

                </div>

            </div>


            <!-- Email and Phone -->

            <div class="form-row">

                <div class="form-group">

                    <label for="email">
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="01XXXXXXXXX"
                        pattern="[0-9]{11}"
                        required
                    >

                    <div class="hint">
                        Enter 11 digit phone number.
                    </div>

                </div>

            </div>


            <!-- Gender and DOB -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Gender <span class="required">*</span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                required
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label for="dob">
                        Date of Birth <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="form-row">

                <div class="form-group">

                    <label for="password">
                        Password <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        placeholder="Enter password"
                        required
                    >

                    <div class="hint">
                        Minimum 8 characters.
                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmpassword">
                        Confirm Password <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmpassword"
                        name="confirmpassword"
                        minlength="8"
                        placeholder="Confirm password"
                        required
                    >

                </div>

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">
                    Address <span class="required">*</span>
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your full address"
                    required
                ></textarea>

            </div>


            <!-- Department and Semester -->

            <div class="form-row">

                <div class="form-group">

                    <label for="department">
                        Department <span class="required">*</span>
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            Computer Science & Engineering
                        </option>

                        <option value="EEE">
                            Electrical & Electronic Engineering
                        </option>

                        <option value="BBA">
                            Business Administration
                        </option>

                        <option value="English">
                            English
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <select
                        id="semester"
                        name="semester"
                    >

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1st">
                            1st Semester
                        </option>

                        <option value="2nd">
                            2nd Semester
                        </option>

                        <option value="3rd">
                            3rd Semester
                        </option>

                        <option value="4th">
                            4th Semester
                        </option>

                        <option value="5th">
                            5th Semester
                        </option>

                        <option value="6th">
                            6th Semester
                        </option>

                        <option value="7th">
                            7th Semester
                        </option>

                        <option value="8th">
                            8th Semester
                        </option>

                        <option value="9th">
                            9th Semester
                        </option>

                        <option value="10th">
                            10th Semester
                        </option>

                        <option value="11th">
                            11th Semester
                        </option>

                        <option value="12th">
                            12th Semester
                        </option>

                    </select>

                </div>

            </div>


            <!-- Skills -->

            <div class="form-group">

                <label>
                    Skills
                </label>

                <div class="skills">

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="HTML"
                        >
                        HTML
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="CSS"
                        >
                        CSS
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="JavaScript"
                        >
                        JavaScript
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Python"
                        >
                        Python
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="C++"
                        >
                        C++
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="Java"
                        >
                        Java
                    </label>

                </div>

            </div>


            <!-- Profile Picture -->

            <div class="form-group">

                <label for="profile">
                    Profile Picture
                </label>

                <input
                    type="file"
                    id="profile"
                    name="profile"

                >

            </div>


            <!-- Website -->

            <div class="form-row">

                <div class="form-group">

                    <label for="website">
                        Personal Website
                    </label>

                    <input
                        type="url"
                        id="website"

                </div>


                <div class="form-group">

            <!-- Buttons -->

            <div class="buttons">

                <input
                    type="submit"

                <input
                    type="reset"
                    value="Reset Form"
                    class="reset-btn"
                >

            </div>

        </form>

    </div>

</body>

</html>

Add this JavaScript **before `</body>`**:

```html
<script>

    const form = document.querySelector("form");

    const password = document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmpassword");

    const passwordMessage =
        document.getElementById("passwordMessage");


    // Check passwords while the user is typing
    confirmPassword.addEventListener("input", function () {

        if (confirmPassword.value === "") {

            passwordMessage.textContent = "";
            confirmPassword.setCustomValidity("");

        }
        else if (password.value !== confirmPassword.value) {

            passwordMessage.textContent =
                "Passwords do not match.";

            passwordMessage.style.color = "red";

            confirmPassword.setCustomValidity(
                "Passwords do not match."
            );

        }
        else {

            passwordMessage.textContent =
                "Passwords match.";

            passwordMessage.style.color = "green";

            confirmPassword.setCustomValidity("");

        }

    });


    // Also check if the original password changes
    password.addEventListener("input", function () {

        if (confirmPassword.value !== "") {

            if (password.value !== confirmPassword.value) {

                passwordMessage.textContent =
                    "Passwords do not match.";

                passwordMessage.style.color = "red";

                confirmPassword.setCustomValidity(
                    "Passwords do not match."
                );

            }
            else {

                passwordMessage.textContent =
                    "Passwords match.";

                passwordMessage.style.color = "green";

                confirmPassword.setCustomValidity("");

            }

        }

    });


    // Final check before submission
    form.addEventListener("submit", function (event) {

        if (password.value !== confirmPassword.value) {

            event.preventDefault();

            passwordMessage.textContent =
                "Passwords do not match.";

            passwordMessage.style.color = "red";

            confirmPassword.setCustomValidity(
                "Passwords do not match."
            );

            confirmPassword.reportValidity();

        }

    });

</script>
